# =============================================================================
#  openmc-arayuz -- paket tanimi
#
#  SURUM TEK YERDE: [project].version. Kod surumu cekirdek/surum.py uzerinden
#  okur (kaynak agacinda bu dosya, wheel/conda paketinde paket meta verisi).
#
#  KURULUM (conda ortaminda; OpenMC PyPI'da YOK, conda-forge'dan gelir):
#      conda env create -f environment.yml && conda activate openmc-env
#      pip install -e . --no-deps
#  Ayrintilar: KURULUM.md
# =============================================================================
[build-system]
# >=77: PEP 639 lisans alanlari (license = SPDX ifadesi, license-files)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openmc-arayuz"
version = "3.0.0"
description = "OpenMC ile reaktor modeli kurma, calistirma ve sonuc okuma arayuzu"
readme = "README.md"
requires-python = ">=3.11"
# Lisans: tum haklari saklidir (ozel mulk; acik kaynak lisansi DEGIL).
# Ucuncu taraf bilesenlerin lisanslari: THIRD_PARTY_LICENSES.md
# (PEP 639: SPDX "LicenseRef-" = SPDX listesinde olmayan, kendine ozgu lisans)
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
# openmc (>=0.16.0,<0.17) BURADA YOK: PyPI'da yayimlanmiyor; conda-forge'dan
# kurulur (environment.yml). Buraya yazilirsa `pip install` PyPI'da arayip
# basarisiz olur. Testlerdeki referans degerler openmc 0.16.0 ile olculdu.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",          # cekirdek/vv/istatistik.py (V&V istatistikleri); openmc'nin de bagimliligi
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "h5py>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-xdist>=3.5"]
ceviri = ["babel>=2.12"]

[project.scripts]
openmc-arayuz = "cekirdek.giris:gui"
openmc-arayuz-kosu = "cekirdek.giris:kosu"

[tool.setuptools.packages.find]
include = ["cekirdek*", "arayuz*"]

[tool.setuptools.package-data]
# Paket ICI veri (cekirdek/yollar.py: ikon_dizini, font_dizini, rapor_sablon_dizini).
# rapor sablonlari (string.Template) wheel icinde olmali
"cekirdek.rapor_sablon" = ["*.html", "*.css"]
# nukleer veri katalogu (cekirdek/veri_indir.py: katalog_yolu)
"cekirdek" = ["veri_katalogu.json"]
# masaustu butunlesmesi (cekirdek/masaustu: .desktop sablonu, MIME XML, simgeler)
"cekirdek.masaustu" = ["kaynaklar/*"]
"arayuz" = ["kaynaklar/*.txt", "kaynaklar/fontlar/*", "kaynaklar/ikonlar/*"]

[tool.setuptools.data-files]
# Paket DISI veri: <onek>/share/openmc-arayuz/<kaynak agacindaki yol> (conda
# paketi de ayni duzeni kurar: conda-recipe/build.sh). cekirdek/yollar.py
# veri_koku() bu dizini kurulu dagitimin kaydindan bulur. Yeni bir alt dizin
# eklenirse buraya da yazilmali (testler/test_t2_yollar.py denetler).
# Yalniz derlenmis ceviri (.mo) kurulur; .po/.pot gelistirme dosyasidir.
"share/openmc-arayuz/ornekler" = ["ornekler/*.json"]
"share/openmc-arayuz/ornekler/vv" = ["ornekler/vv/*.json"]
"share/openmc-arayuz/ornekler/bolme" = ["ornekler/bolme/*.json"]
"share/openmc-arayuz/locale/en/LC_MESSAGES" = ["locale/en/LC_MESSAGES/*.mo"]
"share/openmc-arayuz/docs/kilavuz/tr" = ["docs/kilavuz/tr/*"]
"share/openmc-arayuz/docs/kilavuz/en" = ["docs/kilavuz/en/*"]
"share/openmc-arayuz/docs/kilavuz/resimler/tr" = ["docs/kilavuz/resimler/tr/*"]
"share/openmc-arayuz/docs/kilavuz/resimler/en" = ["docs/kilavuz/resimler/en/*"]

# -----------------------------------------------------------------------------
# pytest: testler/test_*.py modullerindeki HIZLI/YAVAS listeleri kok
# conftest.py tarafindan toplanir (pytest_pycollect_makemodule); pytest'in
# kendi test_* islev kesfi bu dosyalarda kullanilmaz.
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["testler"]
addopts = "-ra --strict-markers"
markers = [
    "hizli: kosu gerektirmeyen hizli test (eski calistiricida --hizli)",
    "yavas: Monte Carlo / uzun test (eski calistiricida tam mod)",
    "veri: nukleer veri (OPENMC_CROSS_SECTIONS) gerektirir; yoksa atlanir",
    "zincir: tukenme zinciri (OPENMC_CHAIN_FILE ya da ~/nucdata/chain) gerektirir; yoksa atlanir",
    "gereksinim(*kimlikler): testin dogruladigi gereksinim kimlikleri (docs/GEREKSINIMLER.md; testler/ortak_test.gereksinim)",
]
filterwarnings = [
    "ignore::pytest.PytestReturnNotNoneWarning",
]

[tool.coverage.run]
# Kapsam kurali (plan: "Kalite kapilari"): toplam >= %80, dalgada DOKUNULAN her
# modul >= %80 ya da en azindan dusmez. araclar/kapsam.sh olcer.
source = ["cekirdek", "arayuz"]
omit = ["*/__init__.py"]
parallel = true

[tool.coverage.report]
show_missing = false
skip_covered = true
precision = 1
