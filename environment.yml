# OpenMC arayüzü için conda ortamı
#   conda env create -f environment.yml
#   conda activate openmc-env
#
# Geliştirildiği sürümler: Python 3.13, OpenMC 0.16.0, PySide6 6.11,
# matplotlib 3.11, pandas 3.0, h5py 3.16. OpenMC sürümü sabitlenmiştir
# (testlerdeki referans değerler 0.16.0 ile ölçüldü); diğerleri conda-forge'un
# uyumlu sürümüyle gelir.
#
# Uygulamanın kendisi (giriş komutları openmc-arayuz, openmc-arayuz-kosu):
#   pip install -e . --no-deps
# Test ve çeviri araçları: pytest, pytest-xdist, pytest-cov (MIT), babel (BSD-3).
name: openmc-env
channels:
  - conda-forge
dependencies:
  - python>=3.11
  # SABIT: yukseltmeden once testler/test_tukenme_hacim.py TH10 (Cell.paths =
  # C++ distribcell sirasi; cekirdek/tukenme_hacim.py bu varsayima dayanir).
  - openmc=0.16.0
  - pyside6
  - matplotlib
  - pandas
  - h5py
  - uncertainties
  - curl
  - pip
  # test ve ceviri araclari
  - pytest>=8
  - pytest-xdist>=3.5
  - pytest-cov>=5
  - babel>=2.12
